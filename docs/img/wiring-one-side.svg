<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#111827">Wiring, one side: S-type load cell → HX711 → Seeed XIAO ESP32-S3</text>
  <text x="40" y="74" font-size="14" fill="#4b5563">The right side is identical and shares 3V3 / GND. Pin labels and wire colours match the Coupang listings (load cell 8863760189, HX711 8449606915).</text>

  <!-- ===================== LOAD CELL ===================== -->
  <!-- tension arrows + eye bolts -->
  <line x1="150" y1="148" x2="150" y2="104" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="172" y="120" font-size="13" fill="#374151">pull → carabiner → door anchor</text>
  <circle cx="150" cy="168" r="15" fill="none" stroke="#6b7280" stroke-width="6"/>
  <line x1="150" y1="183" x2="150" y2="232" stroke="#6b7280" stroke-width="7"/>
  <line x1="150" y1="448" x2="150" y2="497" stroke="#6b7280" stroke-width="7"/>
  <circle cx="150" cy="512" r="15" fill="none" stroke="#6b7280" stroke-width="6"/>
  <line x1="150" y1="532" x2="150" y2="576" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="172" y="565" font-size="13" fill="#374151">pull → carabiner → band + paddle</text>
  <text x="172" y="205" font-size="12" fill="#6b7280">M8 eye bolt</text>
  <text x="172" y="482" font-size="12" fill="#6b7280">M8 eye bolt</text>

  <!-- S-shaped body -->
  <rect x="80" y="230" width="140" height="220" rx="4" fill="#cfd4da" stroke="#6b7280" stroke-width="2"/>
  <rect x="78" y="285" width="104" height="18" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <rect x="118" y="377" width="104" height="18" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <circle cx="150" cy="340" r="20" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <rect x="138" y="230" width="24" height="16" fill="#8b939e"/>
  <rect x="138" y="434" width="24" height="16" fill="#8b939e"/>
  <!-- cable gland + jacket -->
  <rect x="220" y="330" width="24" height="20" rx="2" fill="#374151"/>
  <rect x="244" y="333" width="56" height="14" rx="3" fill="#1f2937"/>

  <text x="150" y="620" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">S-type load cell, 0–50 kg</text>
  <text x="150" y="640" font-size="12" fill="#4b5563" text-anchor="middle">M8×1.25 threads · 2.0 mV/V · 4-core shielded cable</text>

  <!-- ===================== LOAD CELL WIRES ===================== -->
  <polyline points="300,338 340,260 471,260" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="300,339 340,290 471,290" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="300,340 345,320 471,320" fill="none" stroke="#6b7280" stroke-width="7" stroke-linejoin="round"/>
  <polyline points="300,340 345,320 471,320" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="300,342 350,350 471,350" fill="none" stroke="#16a34a" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="300,344 322,470 690,470" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round"/>

  <text x="360" y="253" font-size="12" fill="#dc2626">red · EXC+</text>
  <text x="360" y="283" font-size="12" fill="#111827">black · EXC−</text>
  <text x="360" y="313" font-size="12" fill="#4b5563">white · SIG−</text>
  <text x="360" y="343" font-size="12" fill="#16a34a">green · SIG+</text>
  <text x="380" y="463" font-size="12" fill="#6b7280">shield (bare) → GND</text>

  <!-- ===================== HX711 ===================== -->
  <rect x="460" y="230" width="200" height="220" rx="6" fill="#1f7a3a" stroke="#14532d" stroke-width="2"/>
  <rect x="525" y="290" width="66" height="90" rx="3" fill="#111827"/>
  <text x="558" y="339" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">HX711</text>
  <!-- left pads: load cell side -->
  <g fill="#d4a017" stroke="#7c5c0a" stroke-width="1.5">
    <circle cx="478" cy="260" r="7"/><circle cx="478" cy="290" r="7"/><circle cx="478" cy="320" r="7"/>
    <circle cx="478" cy="350" r="7"/><circle cx="478" cy="380" r="7"/><circle cx="478" cy="410" r="7"/>
  </g>
  <g font-size="13" font-weight="600" fill="#ffffff">
    <text x="492" y="265">E+</text><text x="492" y="295">E−</text><text x="492" y="325">A−</text>
    <text x="492" y="355">A+</text><text x="492" y="385" fill="#a7d7b5">B−</text><text x="492" y="415" fill="#a7d7b5">B+</text>
  </g>
  <!-- right pads: MCU side -->
  <g fill="#d4a017" stroke="#7c5c0a" stroke-width="1.5">
    <circle cx="642" cy="260" r="7"/><circle cx="642" cy="300" r="7"/><circle cx="642" cy="340" r="7"/><circle cx="642" cy="380" r="7"/>
  </g>
  <g font-size="13" font-weight="600" fill="#ffffff" text-anchor="end">
    <text x="628" y="265">VCC</text><text x="628" y="305">SCK</text><text x="628" y="345">DT</text><text x="628" y="385">GND</text>
  </g>
  <!-- rate pad -->
  <rect x="604" y="420" width="36" height="16" rx="2" fill="#d4a017" stroke="#7c5c0a"/>
  <text x="598" y="433" font-size="11" fill="#ffffff" text-anchor="end">RATE</text>

  <text x="560" y="620" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">HX711 board (XFW-HX711)</text>
  <text x="560" y="640" font-size="12" fill="#4b5563" text-anchor="middle">Set the RATE pad to 80 Hz · B± unused</text>

  <!-- ===================== HX711 → XIAO WIRES ===================== -->
  <!-- SCK, DT straight across -->
  <line x1="649" y1="300" x2="865" y2="300" stroke="#2563eb" stroke-width="4"/>
  <line x1="649" y1="340" x2="865" y2="340" stroke="#f59e0b" stroke-width="4"/>
  <text x="760" y="293" font-size="12" fill="#2563eb" text-anchor="middle">SCK → D0</text>
  <text x="760" y="333" font-size="12" fill="#b45309" text-anchor="middle">DT → D1</text>
  <!-- VCC → 3V3 over the top -->
  <polyline points="649,260 700,260 700,190 1080,190 1080,380 1035,380" fill="none" stroke="#e11d48" stroke-width="4" stroke-linejoin="round"/>
  <text x="890" y="182" font-size="12" fill="#e11d48" text-anchor="middle">VCC → 3V3</text>
  <!-- GND under the bottom, with a hop over 3V3 -->
  <path d="M649,380 L690,380 L690,680 L1110,680 L1110,340 L1090,340 A10,10 0 0 0 1070,340 L1035,340" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
  <text x="915" y="672" font-size="12" fill="#111827" text-anchor="middle">GND → GND</text>
  <circle cx="690" cy="470" r="5" fill="#111827"/>

  <!-- second side stubs -->
  <line x1="735" y1="380" x2="865" y2="380" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="735" y1="420" x2="865" y2="420" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="740" y="373" font-size="11" fill="#2563eb">to right HX711 SCK</text>
  <text x="740" y="413" font-size="11" fill="#b45309">to right HX711 DT</text>

  <!-- ===================== XIAO ESP32-S3 ===================== -->
  <rect x="925" y="230" width="50" height="26" rx="5" fill="#9ca3af" stroke="#4b5563"/>
  <text x="950" y="224" font-size="11" fill="#4b5563" text-anchor="middle">USB-C</text>
  <rect x="860" y="250" width="180" height="320" rx="8" fill="#253041" stroke="#111827" stroke-width="2"/>
  <rect x="912" y="330" width="64" height="140" rx="4" fill="#c0c4c8" stroke="#6b7280"/>
  <text x="944" y="396" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">ESP32-S3</text>
  <text x="944" y="411" font-size="9" fill="#4b5563" text-anchor="middle">module</text>
  <g fill="#d4a017" stroke="#7c5c0a" stroke-width="1.5">
    <circle cx="872" cy="300" r="7"/><circle cx="872" cy="340" r="7"/><circle cx="872" cy="380" r="7"/><circle cx="872" cy="420" r="7"/>
    <circle cx="872" cy="460" r="7"/><circle cx="872" cy="500" r="7"/><circle cx="872" cy="540" r="7"/>
    <circle cx="1028" cy="300" r="7"/><circle cx="1028" cy="340" r="7"/><circle cx="1028" cy="380" r="7"/><circle cx="1028" cy="420" r="7"/>
    <circle cx="1028" cy="460" r="7"/><circle cx="1028" cy="500" r="7"/><circle cx="1028" cy="540" r="7"/>
  </g>
  <g font-size="12" font-weight="600" fill="#ffffff">
    <text x="884" y="304">D0</text><text x="884" y="344">D1</text><text x="884" y="384">D2</text><text x="884" y="424">D3</text>
    <text x="884" y="464" fill="#9aa5b4">D4</text><text x="884" y="504" fill="#9aa5b4">D5</text><text x="884" y="544" fill="#9aa5b4">D6</text>
  </g>
  <g font-size="12" font-weight="600" fill="#ffffff" text-anchor="end">
    <text x="1016" y="304" fill="#9aa5b4">5V</text><text x="1016" y="344">GND</text><text x="1016" y="384">3V3</text><text x="1016" y="424" fill="#9aa5b4">D10</text>
    <text x="1016" y="464" fill="#9aa5b4">D9</text><text x="1016" y="504" fill="#9aa5b4">D8</text><text x="1016" y="544" fill="#9aa5b4">D7</text>
  </g>
  <text x="950" y="562" font-size="10" fill="#9aa5b4" text-anchor="middle">BAT+ / BAT− pads on the back</text>

  <text x="950" y="620" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Seeed XIAO ESP32-S3</text>
  <text x="950" y="640" font-size="12" fill="#4b5563" text-anchor="middle">top view, USB-C up</text>

  <!-- ===================== NOTES ===================== -->
  <rect x="40" y="705" width="1120" height="100" rx="8" fill="#f3f4f6"/>
  <g font-size="13" fill="#1f2937">
    <text x="60" y="730">• <tspan font-weight="600">Tension:</tspan> the seller notes green/white swap when the cell is pulled. If force reads negative, swap A+/A− or set kSignLeft = −1 in config.h.</text>
    <text x="60" y="752">• <tspan font-weight="600">Power at 3.3 V:</tspan> keep HX711 VCC on 3V3 (not 5V) so DT stays at 3.3 V logic. The cell is rated 5–12 V excitation; 3.3 V just gives a smaller signal.</text>
    <text x="60" y="774">• <tspan font-weight="600">Second side:</tspan> identical cell + HX711, sharing 3V3 and GND; its SCK → D2, DT → D3.</text>
    <text x="60" y="796">• <tspan font-weight="600">Battery:</tspan> LiPo to the BAT+/BAT− pads under the XIAO (check polarity). Shield wire to GND.</text>
  </g>
</svg>
