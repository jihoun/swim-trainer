; Swim power meter firmware
; Board: Seeed XIAO ESP32-S3 (native USB-C, no driver needed on macOS)

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    olkal/HX711_ADC@^1.2.12

; Host-side unit tests for lib/swimpower (no hardware needed):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
